  // 第 5 格：自己打扮
  const my=document.createElement('div'); my.className='mytile'; my.innerHTML='<canvas width="72" height="80"></canvas><span>🎨 自己打扮</span>';
  my.onclick=()=>{ openDresser(); };
  box.appendChild(my); tiles.push(my);
  window.__refreshMyTile = ()=>{ paintAvatar(my.querySelector('canvas'), buildLook(custom), 'down', 2, 15); };
  window.__selectTile = select;
  custom = Object.assign({}, PRESETS[0]); select(0); __refreshMyTile();
  const sv = loadSave();
  if(sv){
    $('#btnLoad').classList.remove('hidden'); if(sv.cls) $('#inCls').value = sv.cls; $('#inName').value = sv.name||'';
    if(sv.custom){ custom = Object.assign({}, PRESETS[0], sv.custom); select(4); }
    else { const i = PRESETS[sv.look] ? sv.look : 0; custom = Object.assign({}, PRESETS[i]); select(i); }
    __refreshMyTile();
  }
})();
let dressDir = 0, dressBackup = null;
const DIRS4 = ['down','right','up','left'];
function renderDresser(){
  paintAvatar($('#dPrev'), buildLook(custom), DIRS4[dressDir], 3.6, 34);
  let h='';
  for(const k of Object.keys(DRESS)){
    const d=DRESS[k];
    h += `<div class="dline"><b>${d.label}</b><div class="dchips">` + d.opts.map(o=>{
      const v = d.type==='color' ? o : o[0], on = custom[k]===v ? ' on' : '';
      return d.type==='color' ? `<button class="sw${on}" data-k="${k}" data-v="${v}" style="background:${v}" aria-label="${d.label}"></button>`
                              : `<button class="chip2${on}" data-k="${k}" data-v="${v}">${o[1]}</button>`;
    }).join('') + '</div></div>';
  }
  $('#dOpts').innerHTML = h;
  $('#dOpts').querySelectorAll('button').forEach(b=>b.onclick=()=>{ custom[b.dataset.k]=b.dataset.v; sfx('talk'); renderDresser(); });
}
let dressInGame = false;
function openDresser(inGame){
  dressInGame = !!inGame;
  if(dressInGame){ custom = Object.assign({}, buildCustomFromSave()); scene='dress'; clearHeld(); }
  dressBackup = Object.assign({}, custom); dressDir = 0;
  $('#dresser').classList.remove('hidden'); renderDresser(); sfx('talk');
}
function buildCustomFromSave(){ return S.custom ? Object.assign({}, PRESETS[0], S.custom) : Object.assign({}, PRESETS[S.look]||PRESETS[0]); }
function closeDresser(ok){
  if(!ok && dressBackup) custom = dressBackup;
  $('#dresser').classList.add('hidden');
  if(dressInGame){
    if(ok){ S.custom = Object.assign({}, custom); refreshLook(); save(); toast('🎨 換好新造型了！', true); sfx('ok'); }
    scene='play'; dressInGame=false; return;
  }
  if(ok){ __refreshMyTile(); __selectTile(4); sfx('ok'); }
}
$('#dRotL').onclick = ()=>{ dressDir=(dressDir+3)%4; renderDresser(); };
$('#dRotR').onclick = ()=>{ dressDir=(dressDir+1)%4; renderDresser(); };
$('#dPrev').onclick = ()=>{ dressDir=(dressDir+1)%4; renderDresser(); };
$('#dRand').onclick = ()=>{ for(const k of Object.keys(DRESS)){ const o=DRESS[k].opts; const v=o[Math.random()*o.length|0]; custom[k] = DRESS[k].type==='color'?v:v[0]; } sfx('talk'); renderDresser(); };
$('#dDone').onclick = ()=>closeDresser(true);
$('#dCancel').onclick = ()=>closeDresser(false);
function startGame(data, isNew){
  S = data;
  S.badges = S.badges||{}; S.exp = S.exp||0; S.ts = S.ts||{}; S.tries = S.tries||{}; S.playT = S.playT||0;
  if(!S.sid) S.sid = newSid();
  if(!S.cls) S.cls = '';
  S.seen = S.seen||{}; S.wrong = S.wrong||{}; S.acc = S.acc||'';
  hqInit(); invInit(); refreshLook(); compassT = 0;
  if(S.hq.friend>=3){ const yu = NPCS.find(n=>n.id==='yu'); if(yu) yu.wander=[24,14,35,19]; }
  evT = 70; careT = 150; stuckT = 0; evBusy = false;
  P.x = Number.isInteger(S.x) ? S.x : 19; P.y = Number.isInteger(S.y) ? S.y : 31;
  if(SOLID.has(tileAt(P.x,P.y)) || tileAt(P.x,P.y)==='='){ P.x=19; P.y=31; }
  // 讀檔時若有 NPC 站在玩家位置，把 NPC 移回原位
  for(const n of NPCS) if(n.x===P.x && n.y===P.y){ n.x = n.wander ? n.wander[0] : n.x; n.y = n.wander ? n.wander[1] : n.y; n.px=n.x*TS; n.py=n.y*TS; }
  P.px=P.x*TS; P.py=P.y*TS; P.dir=S.dir||'up'; P.moving=false;
  $('#title').classList.add('hidden'); $('#hud').classList.remove('hidden'); $('#hint').classList.remove('hidden');
  $('#mini').classList.toggle('hidden', !showMini);
  if(matchMedia('(pointer:coarse)').matches){ $('#pad').classList.remove('hidden'); $('#abtn').classList.remove('hidden'); $('#mini').classList.add('top'); }
  scene='play'; updateHUD(); curZone=''; checkZone(); save();
  if(isNew){
    say([
      '（叮咚～早上 7 點 30 分，新的一天開始了！）',
      '今天是「校園守護者」培訓日！',
      '學校裡有五位老師，要考驗你：防災、交通安全、性別平等、反霸凌、校園常規。',
      '和頭上有「！」的老師對話、打倒搗蛋怪獸，就能得到「守護徽章」。',
      '集滿 5 枚徽章後，到校長室接受最終挑戰吧！',
      '🎒 書包裡有「提示卡、愛心飯糰、指南針」，按右上角的 🎒（或 B 鍵）就能查看。跟校園裡的大人聊聊，還能拿到更多道具喔！',
      '首先……請等小綠人亮起，走斑馬線安全地過馬路進校園！（方向鍵移動，空白鍵對話）'
    ], {name:'旁白'});
  } else {
    toast(`歡迎回來，${S.name}！目前徽章 ${badgeCount()}/5`, true);
  }
}
function cleanNick(s){ return String(s||'').replace(/[<>"'&\u0000-\u001f]/g,'').trim().slice(0,8); }
$('#btnNew').onclick = ()=>{
  const cls = ($('#inCls').value||'').replace(/\D/g,'');
  const name = cleanNick($('#inName').value);
  const err = $('#tErr');
  if(!/^\d{3,4}$/.test(cls)){ err.textContent='請輸入班級（3～4 位數字，例如 301）'; $('#inCls').focus(); sfx('warn'); return; }
  if(!name){ err.textContent='請輸入暱稱（最多 8 個字）'; $('#inName').focus(); sfx('warn'); return; }
  err.textContent='';
  const old = loadSave();
  if(old && !confirm('開始新遊戲會覆蓋這台裝置上原本的進度，確定嗎？')) return;
  sfx('ok');
  const ns = newSave(name, lookSel<4 ? lookSel : 0, cls); ns.custom = Object.assign({}, custom);
  startGame(ns, true);
};
$('#btnLoad').onclick = ()=>{ const d=loadSave(); if(d){ sfx('ok'); startGame(d,false); } };

/* ---------------- 主迴圈 ---------------- */
let last = performance.now(), saveT = 0;
const cam = {x:0, y:0};
function update(dt){
  T += dt; lightT += dt;
  updateCars(dt);
  if(scene!=='celebrate') updateNPCs(dt);
  updateFX(dt);
  if(scene==='celebrate'){ updateCel(dt); return; }
  if(S && (scene==='play' || scene==='battle') && !document.hidden) S.playT = (S.playT||0) + dt;
  if(compassT>0 && scene==='play') compassT -= dt;
  if(DLG){
    const L=DLG.lines[DLG.i];
    if(DLG.shown < L.t.length){ DLG.shown = Math.min(L.t.length, DLG.shown + dt*40); renderDlg(); }
  }
  if(scene!=='play') return;
  const panelOpen = !$('#panel').classList.contains('hidden');
  const free = !DLG && !panelOpen && !evBusy && !QTE && !P.moving;
  updateEvents(dt, free);
  updateCare(dt, free);
  updateEscort();
  if(P.moving){
    const tx=P.x*TS, ty=P.y*TS, sp=150*dt;
    P.px += clamp(tx-P.px,-sp,sp); P.py += clamp(ty-P.py,-sp,sp);
    P.anim += dt; P.step = Math.floor(P.anim*8)%2 ? 1 : 2;
    if(P.px===tx && P.py===ty){ P.moving=false; puff(P.px,P.py); onArrive(); }
  }
  if(!P.moving){
    const d = (!DLG && !panelOpen && !evBusy && !QTE && !ESC) ? currentDir() : null;
    if(d) tryStep(d); else P.step=0;
  }
  saveT += dt; if(saveT>5){ saveT=0; save(); }
  const t = (!DLG && !P.moving && !panelOpen) ? facingTarget() : null;
  P.target = t;
  const hint = $('#hint');
  const txt = t ? (t.npc ? `💬 空白鍵：和「${t.npc.name}」說話` : '📋 空白鍵：查看') : '方向鍵移動｜Q 任務｜B 道具｜M 地圖｜R 排行榜';
  if(hint.textContent!==txt) hint.textContent = txt;
}
function render(){
  if(scene==='title'){
    cam.x = Math.round((Math.sin(T*0.07)+1)/2*(MW*TS-VW));
    cam.y = Math.round(clamp(15*TS + Math.sin(T*0.05)*170 - VH/2, 0, MH*TS-VH));
  } else {
    cam.x = Math.round(clamp(P.px+16-VW/2, 0, MW*TS-VW));
    cam.y = Math.round(clamp(P.py+16-VH/2, 0, MH*TS-VH));
  }
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(mapCv, cam.x, cam.y, VW, VH, 0, 0, VW, VH);
  ctx.save(); ctx.translate(-cam.x, -cam.y);
  drawWater(ctx, T);
  if(S && badgeCount()>=5){ // 校長室門打開
    const X=19*TS, Y=8*TS; drawFloor(ctx,X,Y+12,19,7,BLD[1]); ctx.fillStyle='#a8343a'; ctx.fillRect(X+4,Y+12,TS-8,20);
    ctx.fillStyle='#7a4a24'; ctx.fillRect(X,Y+12,4,20); ctx.fillRect(X+TS-4,Y+12,4,20);
  }
  drawHidden(ctx, T);
  for(const c of CARS) drawCar(ctx,c);
  // 地面光圈（任務 NPC）
  for(const n of NPCS){
    if(S && ((n.quest && !S.badges[n.quest]) || (n.id==='principal' && badgeCount()>=5 && !S.done))){
      const qc = n.quest ? TOPIC_COLOR[n.quest] : '#ffe066';
      ctx.globalAlpha = .35 + .2*Math.sin(T*4);
      ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.ellipse(n.px+16, n.py+29, 14, 5, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = .7; ctx.strokeStyle=qc; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(n.px+16, n.py+29, 15+Math.sin(T*4)*1.5, 5.5, 0, 0, 7); ctx.stroke(); ctx.globalAlpha=1;
    }
  }
  for(const d of FX.dust){ ctx.globalAlpha = d.l*2; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
  // 角色＋道具依深度排序
  const ents = NPCS.map(n=>({k:'p',o:n,py:n.py}));
  if(scene!=='title') ents.push({k:'p',o:P,py:P.py});
  if(scene!=='celebrate') for(const r of RUNNERS){ const q=runnerPos(r); ents.push({k:'p', o:{px:q.x, py:q.y, dir:q.dir, look:r.look, step:Math.floor(T*9+r.s*50)%2+1}, py:q.y}); }
  for(const p of PROPS) if(p.x*TS > cam.x-64 && p.x*TS < cam.x+VW+32 && p.y*TS > cam.y-32 && p.y*TS < cam.y+VH+64) ents.push({k:'r',o:p,py:p.py});
  ents.sort((a,b)=>a.py-b.py || (a.k==='r') - (b.k==='r'));
  for(const e of ents){
    if(e.k==='r') drawProp(ctx, e.o, T);
    else {
      const hop = CEL ? Math.abs(Math.sin(T*6 + e.o.px*.05))*7 : 0;
      drawPerson(ctx, e.o.px, e.o.py - hop, e.o.dir, e.o.look, CEL ? 0 : e.o.step);
    }
  }
  // 圖書館裡飄浮的金色微塵
  if(cam.x+VW > 41*TS && cam.y < 10*TS){
    for(const m of FX.motes){ ctx.globalAlpha = .35+.35*Math.sin(m.p*2); ctx.fillStyle='#fff1b8'; ctx.beginPath(); ctx.arc(m.x, m.y, 1.4, 0, 7); ctx.fill(); }
    ctx.globalAlpha=1;
  }
  // 蝴蝶
  for(const f of FX.flies){
    const fx = f.hx + Math.sin(f.p*.9)*40 + Math.sin(f.p*2.3)*10, fy = f.hy + Math.cos(f.p*.7)*24 - 6;
    const w = Math.abs(Math.sin(f.p*14))*4+1;
    ctx.fillStyle=f.c; ctx.strokeStyle=OL; ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(fx-w/2-1, fy, w/2+.5, 3, 0, 0, 7); ctx.ellipse(fx+w/2+1, fy, w/2+.5, 3, 0, 0, 7); ctx.fill(); ctx.stroke();
  }
  // 名牌與標記
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const n of NPCS){
    if(!n.quest && n.id!=='principal') continue;
    const short = n.name.split(' ').pop();
    ctx.font='bold 12px "Microsoft JhengHei",sans-serif';
    const w = ctx.measureText(short).width+10;
    const tc = n.quest ? TOPIC_COLOR[n.quest] : '#7a4a24';
    const ic = n.quest ? TOPICS[n.quest].icon : '🏫';
    ctx.font='bold 12px "Microsoft JhengHei",sans-serif';
    const tw = w + 14;
    ctx.fillStyle=tc; ctx.strokeStyle='rgba(43,34,51,.85)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.roundRect(n.px+16-tw/2, n.py+33, tw, 16, 8); ctx.fill(); ctx.stroke();
    ctx.font='10px sans-serif'; ctx.fillText(ic, n.px+16-tw/2+9, n.py+41.5);
    ctx.font='bold 12px "Microsoft JhengHei",sans-serif'; ctx.fillStyle='#fff'; ctx.fillText(short, n.px+16+6, n.py+41.5);
    let mark = null;
    if(S && n.quest && !S.badges[n.quest]) mark='!';
    if(S && n.id==='principal' && badgeCount()>=5 && !S.done) mark='★';
    if(mark){
      const by = n.py - 22 + Math.sin(T*5)*3;
      ctx.lineWidth=2; ctx.strokeStyle=OL;
      ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.roundRect(n.px+7, by-10, 18, 20, 6); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(n.px+13,by+10); ctx.lineTo(n.px+16,by+15); ctx.lineTo(n.px+19,by+10); ctx.fillStyle='#ffe066'; ctx.fill(); ctx.stroke();
      ctx.fillStyle='#ffe066'; ctx.fillRect(n.px+13.5,by+8,5,3);
      ctx.fillStyle=OL; ctx.font='900 15px sans-serif'; ctx.fillText(mark, n.px+16, by+1);
    }
  }
  drawCompass(ctx);
  // 互動提示箭頭
  if(scene==='play' && P.target && !DLG){
    const t=P.target, ax = t.x*TS+16, ay = t.y*TS - (t.npc?30:14) + Math.sin(T*6)*3;
    if(!(t.npc && t.npc.quest && !S.badges[t.npc.quest])){
      ctx.fillStyle='#fff'; ctx.strokeStyle=OL; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(ax-7,ay-6); ctx.lineTo(ax+7,ay-6); ctx.lineTo(ax,ay+3); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  // 雲影、花瓣
  for(const c of FX.clouds){ const gr=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r); gr.addColorStop(0,'rgba(30,30,60,.10)'); gr.addColorStop(1,'rgba(30,30,60,0)'); ctx.fillStyle=gr; ctx.fillRect(c.x-c.r,c.y-c.r,c.r*2,c.r*2); }
  for(const p of FX.petals){ ctx.fillStyle=p.c; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.s); ctx.beginPath(); ctx.ellipse(0,0,3,1.8,0,0,7); ctx.fill(); ctx.restore(); }
  // 飛鳥與地面影子
  for(const b of FX.birds){
    ctx.fillStyle='rgba(30,20,50,.18)'; ctx.beginPath(); ctx.ellipse(b.x+50, b.y+90, 4, 1.6, 0, 0, 7); ctx.fill();
    const f = Math.sin(b.p)*4;
    ctx.strokeStyle='#3a3248'; ctx.lineWidth=1.8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(b.x-6, b.y-f); ctx.quadraticCurveTo(b.x-3, b.y-2-f*.3, b.x, b.y); ctx.quadraticCurveTo(b.x+3, b.y-2-f*.3, b.x+6, b.y-f); ctx.stroke();
  }
  // 室內：外面變暗、室內打上暖色燈光
  if(indoor.a>.01 && indoor.b){
    const b=indoor.b, x=b.x1*TS, y=b.y1*TS, w=(b.x2-b.x1+1)*TS, h=(b.y2-b.y1+1)*TS;
    ctx.fillStyle=`rgba(20,16,40,${.4*indoor.a})`; ctx.beginPath(); ctx.rect(cam.x-4, cam.y-4, VW+8, VH+8); ctx.rect(x, y, w, h); ctx.fill('evenodd');
    ctx.save(); ctx.globalCompositeOperation='screen';
    const gr=ctx.createRadialGradient(x+w/2, y+h/2, 10, x+w/2, y+h/2, Math.max(w,h)*.7);
    gr.addColorStop(0,`rgba(${b.glow},${.22*indoor.a})`); gr.addColorStop(1,`rgba(${b.glow},0)`);
    ctx.fillStyle=gr; ctx.fillRect(x, y, w, h); ctx.restore();
  }
  ctx.restore();
  drawWind();
  drawDaylight();
  drawRain();
  drawCelebrate();
  ctx.drawImage(vignette,0,0);
  renderMini();
}
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------------- 縮放 ---------------- */
function fit(){
  const s = Math.min(innerWidth/816, innerHeight/592);
  $('#game').style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fit); fit();
</script>
